{% extends 'core/base.html' %}

{% block extra_head %}
<meta http-equiv="refresh" content="2.5;url={% url 'dashboard' %}" />
<style>
    .success-container {
        text-align: center;
        padding: 40px 20px;
    }
    
    .check-circle {
        width: 80px;
        height: 80px;
        background: rgba(105, 201, 208, 0.2);
        border: 2px solid var(--tk-cyan);
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
        animation: scaleIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    
    .check-mark {
        color: var(--tk-cyan);
        font-size: 40px;
        animation: checkDraw 0.5s ease-out 0.3s forwards;
        opacity: 0;
    }
    
    .loading-dots {
        margin-top: 20px;
        color: var(--text-secondary);
        font-size: 0.9rem;
    }
    
    @keyframes scaleIn {
        from { transform: scale(0); }
        to { transform: scale(1); }
    }
    
    @keyframes checkDraw {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>
{% endblock %}

{% block content %}
<div class="glass-panel" style="max-width: 500px;">
    <div class="success-container">
        <div class="check-circle">
            <span class="check-mark">✓</span>
        </div>
        <h2 style="color: var(--text-primary); margin-bottom: 10px;">Authentication Successful!</h2>
        <p style="color: var(--text-secondary);">Your TikTok account is now securely linked.</p>
        
        <div class="loading-dots">
            Redirecting to dashboard...
        </div>
    </div>
</div>
{% endblock %}
